name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Format, Build, Test, and DocC
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.3'

      - name: Show Swift version
        run: swift --version

      - name: Lint
        run: swift format lint --strict --recursive Package.swift Sources Tests

      - name: Build
        run: swift build

      - name: Build DocC documentation
        run: xcodebuild docbuild -scheme TestCommons -destination 'generic/platform=macOS'

      - name: Test
        run: swift test --enable-code-coverage

      - name: Check coverage
        run: python3 Scripts/check-coverage.py --diff-base "origin/${{ github.base_ref || 'main' }}"

      - name: Build and validate DocC documentation
        run: python3 Scripts/build-documentation.py

      - name: Build XCUITest helpers for iOS
        run: xcodebuild -scheme TestCommonsXCUI -destination 'generic/platform=iOS Simulator' build

      # The UIKit rendering paths only run on iOS; macOS tests exercise AppKit.
      - name: Test SwiftUI rendering on iOS Simulator
        run: |
          device="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, entries in devices.items() if "iOS" in runtime
                     for d in entries if d["name"].startswith("iPhone")))')"
          xcodebuild test -scheme TestCommons-Package -destination "id=$device" -only-testing:TestCommonsUITests

  linux:
    name: Linux core build and tests
    runs-on: ubuntu-latest
    container: swift:6.2.4-noble
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swift build --target TestCommons
      - run: swift test
